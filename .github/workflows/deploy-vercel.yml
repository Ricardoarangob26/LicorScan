name: Deploy to Vercel on Catalog Update

on:
  push:
    branches: [main]
    paths:
      - 'frontend/catalog-data.js'
      - 'frontend/index.html'
      - 'package.json'
      - 'vercel.json'
  workflow_dispatch:

env:
  # Not secret: Vercel org/project identifiers, safe to keep in plain text.
  VERCEL_ORG_ID: team_UYnFaouquWBzSqx0D03bA2hr
  VERCEL_PROJECT_ID: prj_eTV1njzAujfdpOEUjFqLHDop0eFi

jobs:
  deploy:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
